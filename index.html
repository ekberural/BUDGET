<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover'><meta name='theme-color' content='#0b0f0d'><link rel='manifest' href='manifest.json'><link rel='apple-touch-icon' href='icon.png'><title>Budget</title><style>
:root{--bg:#0b0f0d;--card:#171c19;--line:#29302c;--green:#75d65c;--orange:#f0a63a;--muted:#9da59f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-text-size-adjust:100%;touch-action:manipulation}.app{max-width:520px;margin:auto;min-height:100vh;padding:calc(20px + env(safe-area-inset-top)) 18px calc(92px + env(safe-area-inset-bottom))}h1{font-size:30px;margin:8px 0 2px}.sub{color:#c8ceca;margin-bottom:22px}.card{background:linear-gradient(145deg,#1b211e,#121714);border:1px solid var(--line);border-radius:20px;padding:18px;margin:14px 0}.label{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.money{font-size:38px;font-weight:750;margin:8px 0}.green{color:var(--green)}.orange{color:var(--orange)}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.btn{width:100%;border:0;border-radius:15px;background:var(--green);color:#071007;font-weight:750;padding:15px;font-size:16px}.ghost{background:#232a26;color:#fff}.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(520px,100%);background:#101512ee;backdrop-filter:blur(12px);display:flex;justify-content:space-around;padding:12px 8px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}.nav button{background:none;border:0;color:#8d9690;font-size:12px}.nav button.active{color:var(--green)}.screen{display:none}.screen.active{display:block}input,select{width:100%;background:#202622;color:#fff;border:1px solid #343c37;border-radius:12px;padding:13px;font-size:16px;margin:6px 0 12px}.pillbar{display:flex;gap:8px}.pill{flex:1;padding:10px;border:1px solid var(--line);border-radius:10px;background:#171c19;color:#aaa}.pill.active{background:#315b2c;color:#fff}.click{cursor:pointer}.small{font-size:13px;color:var(--muted)}.monthCard{cursor:pointer}.top{display:flex;justify-content:space-between;align-items:center}.icon{width:48px;height:48px;border-radius:13px}.modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;z-index:5}.modal.open{display:flex}.sheet{width:min(520px,100%);margin:auto;background:#141916;border-radius:24px 24px 0 0;padding:20px 18px calc(25px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}.x{float:right;background:none;border:0;color:#fff;font-size:24px}.progress{height:7px;background:#28302b;border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;background:var(--green)}
</style></head><body><main class='app'>
<section id='home' class='screen active'><div class='top'><div><h1>Dashboard</h1><div class='sub' id='monthTitle'></div></div><img class='icon' src='icon.png'></div><div class='card'><div class='label'>Monthly salary</div><div id='salary' class='money green'></div><div class='small'>Payday · 5th</div></div><div class='card'><div class='label'>Potential saving</div><div id='saving' class='money green'></div><div id='rate'></div><div class='progress'><i id='bar'></i></div></div><div id='expenseOverview' class='card click'><div class='label'>Expenses overview · tap for details</div><div class='row'><span>Fixed Expenses</span><b id='fixedTotal' class='green'></b></div><div class='row'><span>Other Expenses</span><b id='otherTotal' class='orange'></b></div><div class='row'><b>Total Expenses</b><b id='total'></b></div></div><button class='btn' onclick='openAdd()'>＋ Add Expense</button><div class='card'><div class='label'>Monthly summary</div><div id='miniMonths'></div></div></section>
<section id='months' class='screen'><h1>Months</h1><div class='sub'>Salary, expenses and potential saving</div><button class='btn' onclick='newMonth()'>＋ Add Month</button><div id='monthList'></div></section>
<section id='expenses' class='screen'><h1>Expenses</h1><div class='sub' id='expenseMonth'></div><div class='pillbar'><button class='pill active' data-filter='all'>All</button><button class='pill' data-filter='fixed'>Fixed</button><button class='pill' data-filter='other'>Other</button></div><div class='card' id='expenseList'></div><button class='btn' onclick='openAdd()'>＋ Add Expense</button></section>
<section id='settings' class='screen'><h1>Settings</h1><div class='card'><label>Salary for selected month</label><input id='salaryInput' type='number' inputmode='decimal'><label>Payday</label><input value='5' disabled><button class='btn' onclick='saveSalary()'>Save Salary</button></div><div class='card'><div class='row'><span>Currency</span><b>₺ Turkish Lira</b></div><button class='btn ghost' onclick='resetData()'>Reset Demo Data</button></div></section>
</main><nav class='nav'><button class='active' data-screen='home'>⌂<br>Home</button><button data-screen='months'>▣<br>Months</button><button data-screen='expenses'>☷<br>Expenses</button><button data-screen='settings'>⚙<br>Settings</button></nav>
<div class='modal' id='modal'><div class='sheet'><button class='x' onclick='closeModal()'>×</button><h2 id='modalTitle'>Add Expense</h2><label>Type</label><select id='type'><option value='other'>Other Expense</option><option value='fixed'>Fixed Expense</option></select><label>Expense name</label><input id='ename' placeholder='e.g. Dinner, Taxi, Shopping'><label>Amount (₺)</label><input id='amount' type='number' inputmode='decimal'><button class='btn' onclick='saveExpense()'>Save</button><button id='deleteBtn' class='btn ghost' style='margin-top:10px;display:none' onclick='deleteExpense()'>Delete Expense</button></div></div>
<script>
const demo={selected:'2026-08',months:{'2026-08':{salary:180000,expenses:[['Rent (Kira)',35000,'fixed'],['Site Fee (Aidat)',5000,'fixed'],['Electricity',2500,'fixed'],['Internet',800,'fixed'],['Phone',1200,'fixed'],['Insurance',2000,'fixed'],['Subscriptions',1500,'fixed'],['Water',1000,'fixed'],['Other Fixed',27000,'fixed'],['Flight Ticket',14500,'other'],['Motorcycle Service',8000,'other'],['Hotel',6500,'other'],['Groceries',4500,'other'],['Restaurant',3000,'other']]},'2026-09':{salary:180000,expenses:[['Fixed Expenses',72000,'fixed'],['Other Expenses',26000,'other']]},'2026-10':{salary:190000,expenses:[['Fixed Expenses',76000,'fixed'],['Other Expenses',45500,'other']]}}};
let data=JSON.parse(localStorage.getItem('budgetV1')||'null')||demo, editIndex=null, filter='all'; const fmt=n=>'₺'+Math.round(n).toLocaleString('en-US'); const label=k=>new Date(k+'-05T12:00').toLocaleDateString('en-US',{month:'long',year:'numeric'}); const cur=()=>data.months[data.selected]; const sums=m=>{let f=0,o=0;m.expenses.forEach(e=>e[2]=='fixed'?f+=+e[1]:o+=+e[1]);return {f,o,t:f+o,s:m.salary-f-o}}; function persist(){localStorage.setItem('budgetV1',JSON.stringify(data));render()}
function render(){let m=cur(),s=sums(m);monthTitle.textContent=label(data.selected);salary.textContent=fmt(m.salary);saving.textContent=fmt(s.s);let r=m.salary?s.s/m.salary*100:0;rate.textContent=r.toFixed(1)+'% of income';bar.style.width=Math.max(0,Math.min(100,r))+'%';fixedTotal.textContent=fmt(s.f);otherTotal.textContent=fmt(s.o);total.textContent=fmt(s.t);expenseMonth.textContent=label(data.selected);salaryInput.value=m.salary;miniMonths.innerHTML=Object.entries(data.months).sort().map(([k,v])=>`<div class=row><span>${label(k)}</span><b class=green>${fmt(sums(v).s)}</b></div>`).join('');monthList.innerHTML=Object.entries(data.months).sort().reverse().map(([k,v])=>{let x=sums(v);return `<div class='card monthCard' onclick="selectMonth('${k}')"><b>${label(k)}</b><div class=row><span>Salary</span><span>${fmt(v.salary)}</span></div><div class=row><span>Expenses</span><span>${fmt(x.t)}</span></div><div class=row><span>Potential Saving</span><b class=green>${fmt(x.s)}</b></div></div>`}).join('');renderExpenses()}
function renderExpenses(){expenseList.innerHTML=cur().expenses.map((e,i)=>({e,i})).filter(x=>filter=='all'||x.e[2]==filter).map(x=>`<div class='row click' onclick='editExpense(${x.i})'><span><b>${x.e[0]}</b><br><small class=small>${x.e[2]=='fixed'?'Fixed':'Other'}</small></span><b>${fmt(x.e[1])}</b></div>`).join('')||'<div class=small>No expenses.</div>'}
function show(s){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id==s));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.screen==s));render()};document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.screen));expenseOverview.onclick=()=>show('expenses');document.querySelectorAll('.pill').forEach(p=>p.onclick=()=>{filter=p.dataset.filter;document.querySelectorAll('.pill').forEach(x=>x.classList.toggle('active',x==p));renderExpenses()});
function openAdd(){editIndex=null;modalTitle.textContent='Add Expense';ename.value='';amount.value='';type.value='other';deleteBtn.style.display='none';modal.classList.add('open')}function editExpense(i){editIndex=i;let e=cur().expenses[i];modalTitle.textContent='Edit Expense';ename.value=e[0];amount.value=e[1];type.value=e[2];deleteBtn.style.display='block';modal.classList.add('open')}function closeModal(){modal.classList.remove('open')}function saveExpense(){if(!ename.value.trim()||!amount.value)return alert('Enter expense name and amount.');let e=[ename.value.trim(),+amount.value,type.value];if(editIndex===null)cur().expenses.push(e);else cur().expenses[editIndex]=e;closeModal();persist()}function deleteExpense(){if(editIndex!==null&&confirm('Delete this expense?')){cur().expenses.splice(editIndex,1);closeModal();persist()}}function saveSalary(){cur().salary=+salaryInput.value||0;persist();show('home')}function selectMonth(k){data.selected=k;persist();show('home')}function newMonth(){let k=prompt('Month (YYYY-MM), e.g. 2026-11');if(!/^\d{4}-\d{2}$/.test(k||''))return;if(!data.months[k])data.months[k]={salary:cur().salary,expenses:cur().expenses.filter(e=>e[2]=='fixed').map(e=>[...e])};data.selected=k;persist();show('home')}function resetData(){if(confirm('Reset all data to demo values?')){localStorage.removeItem('budgetV1');data=JSON.parse(JSON.stringify(demo));persist()}}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
